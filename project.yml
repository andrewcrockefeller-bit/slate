# XcodeGen spec.
#
# The .xcodeproj is generated from this file, not committed. Regenerate with:
#
#     xcodegen generate
#
# Why this exists: a hand-maintained Xcode project is an opaque binary-ish
# artifact that merges badly and drifts silently. This file is the actual
# source of truth for how the app target is wired, it is readable in a diff,
# and it makes "how is this project configured" a question with a written
# answer.
#
# If XcodeGen is ever abandoned: run `xcodegen generate` one last time, commit
# the resulting Slate.xcodeproj, delete this file, and carry on. It is a
# build-time generator, not a runtime dependency, and nothing in the app links
# against it.

name: Slate

options:
  # Reverse-DNS on a name we control. The obvious `com.slate` is already
  # registered to somebody else's team — bundle identifiers are globally unique
  # across all of Apple's developer accounts, not per-account — and Xcode
  # reports that as "cannot be registered to your development team because it
  # is not available", which reads like a permissions problem and is a
  # namespace collision.
  bundleIdPrefix: com.andrewrock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Project-level defaults, inherited by every target.
#
# XcodeGen defaults SWIFT_VERSION to 5.0 at the project level. The app target
# overrides it below, so the app was always building correctly — but any target
# added later (the first XCTest target, an app extension) would silently
# inherit Swift 5 mode and behave differently from the packages for no visible
# reason. Setting it here makes the whole project uniform.
settings:
  base:
    SWIFT_VERSION: "6.0"

# Layer 1 and Layer 2 as local packages. The app depends on both; neither
# depends on the app, and SlateCore depends on nothing at all.
packages:
  SlateCore:
    path: Packages/SlateCore
  SlatePlatform:
    path: Packages/SlatePlatform

targets:
  Slate:
    type: application
    platform: iOS

    sources:
      - path: App/Slate

    dependencies:
      - package: SlateCore
        product: SlateCore
      - package: SlatePlatform
        product: SlatePlatform

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewrock.slate
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic

        # The signing team, pinned here rather than left to Xcode.
        #
        # Selecting a team in Xcode writes DEVELOPMENT_TEAM into the generated
        # project — which the next `xcodegen generate` throws away, silently
        # resetting Team to None and breaking the build with an error about
        # provisioning that looks nothing like "your generator overwrote this".
        # Anything Xcode's UI can set on a generated project has to live in the
        # spec or it does not survive.
        #
        # This is a free Personal Team identifier, not a secret: it appears in
        # every build of the app and identifies the developer account, nothing
        # more.
        DEVELOPMENT_TEAM: 9F9H7CXAN7

        # Both families on purpose. iPad is the design target and the Pencil
        # experience is the product, but Invariant 5 says nothing may assume a
        # screen size — and restricting the device family is exactly that
        # assumption, expressed in build settings where it is easy to forget.
        TARGETED_DEVICE_FAMILY: "1,2"

        GENERATE_INFOPLIST_FILE: YES

        # Adding Assets.xcassets (for the design-system Color Sets) makes
        # newer Xcode infer ASSETCATALOG_COMPILER_APPICON_NAME = "AppIcon"
        # automatically once any asset catalog exists in the target. There is
        # no app icon yet — that's its own task, not part of design-system
        # token work — so this is explicitly suppressed rather than faked
        # with a placeholder icon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: NO

        # All four orientations. A canvas has no preferred way up.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
